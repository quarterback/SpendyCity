kind = "web"
previewPath = "/"
title = "PDX Spend"
version = "1.0.0"
id = "artifacts/pdx-spend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21647

[services.development]
run = "pnpm --filter @workspace/pdx-spend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pdx-spend", "run", "build" ]
publicDir = "artifacts/pdx-spend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/404.html"

[services.env]
PORT = "21647"
BASE_PATH = "/"
