kind = "web"
previewPath = "/"
title = "PDX Spend"
version = "1.0.0"
id = "artifacts/pdx-spend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/", "/api/regenerate-memo", "/feed.xml" ]
localPort = 21647

[services.development]
run = "pnpm --filter @workspace/pdx-spend run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/pdx-spend", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "artifacts/pdx-spend/dist/server/index.js"]

[services.production.run.env]
PORT = "21647"
NODE_ENV = "production"
BASE_PATH = "/"

[services.env]
PORT = "21647"
BASE_PATH = "/"
